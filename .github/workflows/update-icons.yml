name: Update Icons

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          pnpm install

      - name: Generate icons
        run: |
          node bin/export.mjs
          vendor/bin/blade-icons-generate

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-icons
          commit-message: 'feat: update Reicon icons'
          title: 'feat: update Reicon icons'
          body: 'Icons regenerated from the latest `reicon` release on npm.'
